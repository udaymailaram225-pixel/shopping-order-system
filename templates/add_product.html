{% extends "base.html" %}

{% block title %}Add New Product - Admin - Online Shopping System{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h3 class="fw-bold mb-0">
                <i class="bi bi-plus-square text-warning me-2"></i>Add New Product
            </h3>
            <a href="{{ url_for('admin_dashboard') }}" class="btn btn-outline-secondary">
                <i class="bi bi-arrow-left me-1"></i>Back to Admin Dashboard
            </a>
        </div>

        <div class="card border-0 shadow-sm">
            <div class="card-body p-4 p-md-5">
                <form method="POST" action="{{ url_for('add_product') }}" id="add-product-form">
                    <div class="mb-3">
                        <label for="product-name" class="form-label fw-semibold">Product Name</label>
                        <input type="text" class="form-control" id="product-name" name="name" required placeholder="e.g. Wireless Ergonomic Mouse">
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="product-category" class="form-label fw-semibold">Category</label>
                            <input type="text" class="form-control" id="product-category" name="category" required placeholder="e.g. Accessories">
                        </div>
                        <div class="col-md-3 mb-3">
                            <label for="product-price" class="form-label fw-semibold">Price ($)</label>
                            <input type="number" step="0.01" min="0.01" class="form-control" id="product-price" name="price" required placeholder="29.99">
                        </div>
                        <div class="col-md-3 mb-3">
                            <label for="product-stock" class="form-label fw-semibold">Stock Quantity</label>
                            <input type="number" min="0" class="form-control" id="product-stock" name="stock" required placeholder="50">
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="product-description" class="form-label fw-semibold">Product Description</label>
                        <textarea class="form-control" id="product-description" name="description" rows="4" required placeholder="Enter detailed product description..."></textarea>
                    </div>

                    <div class="d-flex justify-content-end gap-2">
                        <a href="{{ url_for('admin_dashboard') }}" class="btn btn-light px-4">Cancel</a>
                        <button type="submit" id="save-product-btn" class="btn btn-warning px-4 fw-bold shadow-sm">
                            <i class="bi bi-check-lg me-1"></i>Save Product
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
