{% extends "base.html" %}

{% block title %}Sign In - Online Shopping System{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5 col-lg-4">
        <div class="card border-0 shadow-sm mt-3">
            <div class="card-body p-4 p-md-5">
                <div class="text-center mb-4">
                    <div class="bg-warning text-dark d-inline-flex align-items-center justify-content-center rounded-circle mb-2" style="width: 56px; height: 56px;">
                        <i class="bi bi-box-arrow-in-right fs-3"></i>
                    </div>
                    <h3 class="fw-bold">Welcome Back</h3>
                    <p class="text-muted small">Sign in to your account</p>
                </div>

                <form method="POST" action="{{ url_for('login', next=request.args.get('next')) }}" id="login-form">
                    <div class="mb-3">
                        <label for="username" class="form-label fw-semibold">Username</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-person"></i></span>
                            <input type="text" class="form-control" id="username" name="username" required placeholder="Enter username">
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="password" class="form-label fw-semibold">Password</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-lock"></i></span>
                            <input type="password" class="form-control" id="password" name="password" required placeholder="Enter password">
                        </div>
                    </div>

                    <button type="submit" id="login-btn" class="btn btn-warning w-100 py-2 fw-bold shadow-sm">
                        <i class="bi bi-arrow-right-circle me-1"></i>Sign In
                    </button>
                </form>

                <div class="text-center mt-4 pt-3 border-top">
                    <small class="text-muted">Don't have an account? <a href="{{ url_for('register') }}" class="text-decoration-none fw-semibold">Register here</a></small>
                </div>
            </div>
        </div>

        <!-- Demonstration helper box for college examiners -->
        <div class="card mt-3 border-0 bg-white shadow-sm">
            <div class="card-body p-3">
                <h6 class="card-title fw-bold text-muted small text-uppercase mb-2">
                    <i class="bi bi-info-circle me-1"></i>Exam Demo Credentials
                </h6>
                <div class="row g-2 small text-secondary">
                    <div class="col-6">
                        <strong>Admin:</strong><br>
                        <code>admin</code> / <code>admin123</code>
                    </div>
                    <div class="col-6">
                        <strong>Customer:</strong><br>
                        <code>customer1</code> / <code>pass123</code>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
